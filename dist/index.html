<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Explore privacy-enhancing technologies and your use case in one conversation.">
  <title>PETs Model</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#messages">Skip to conversation</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="PETs Model home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>PETs Model</span>
      </a>
      <div class="top-actions">
        <span id="source-count" class="source-status" role="status" aria-live="polite">Loading sources…</span>
        <button id="export" class="quiet-button" type="button" title="Download this conversation">Download</button>
        <button id="reset" class="new-button" type="button">New chat</button>
      </div>
    </header>

    <main class="main" id="chat">
      <section class="conversation" aria-label="PETs Model chat">
        <div class="welcome">
          <h1>How can I help?</h1>
          <p>Ask about a PET or describe your use case.</p>
          <div class="starter-pills" role="group" aria-label="Try a question">
            <button type="button" data-prompt="What is differential privacy?">Explain a PET</button>
            <button type="button" data-prompt="I want to explore a use case">Explore a use case</button>
            <button type="button" data-prompt="How do I plan a PET pilot?">Plan a pilot</button>
          </div>
        </div>

        <div id="messages" class="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions" tabindex="0"></div>

        <form id="composer" class="composer">
          <label class="sr-only" for="prompt">Your message</label>
          <textarea id="prompt" rows="2" maxlength="1200" placeholder="Ask a question or describe what you need to do…"></textarea>
          <div class="composer-foot">
            <span>Use a hypothetical case. Do not enter personal data.</span>
            <button type="submit">Send<span class="sr-only"> message</span><span aria-hidden="true"> ↑</span></button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
